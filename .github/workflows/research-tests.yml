name: Research tests

on:
  pull_request:
    paths:
      - "research/arc-agi-3/**"
      - ".github/workflows/research-tests.yml"
  push:
    branches: [main]
    paths:
      - "research/arc-agi-3/**"
      - ".github/workflows/research-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: research/arc-agi-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/arc-agi-3/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q
      - run: python -m ruff check prolong_agent/experiment.py prolong_agent/manifest.py prolong_agent/agent/swarm.py tests
